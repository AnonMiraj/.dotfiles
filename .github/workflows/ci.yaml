name: "CI"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: determinatesystems/nix-installer-action@v20
        with:
          determinate: false
          diagnostic-endpoint: ""
          logger: pretty
          source-url: https://install.lix.systems/lix/lix-installer-x86_64-linux
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          diagnostic-endpoint: ""
      - name: flake check
        run: nix flake check

  # Update the VPS directly: SSH in and rebuild from the pushed flake.
  # The box builds aarch64 natively, so no self-hosted runner is needed.
  # Requires repo secret ALMIRAJ_DEPLOY_KEY: an SSH key authorized for
  # admin@ssh.almiraj.xyz (passwordless sudo).
  almiraj-deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ssh.almiraj.xyz
          username: admin
          key: ${{ secrets.ALMIRAJ_DEPLOY_KEY }}
          fingerprint: SHA256:7pl1zDtSI7wLEe4DuFXqkU4K2wYAiuQRmvFjp2Npu/s
          # Pin to the pushed SHA, not `main`: github: ref fetches hit the
          # root fetcher cache (tarball-ttl 3600s) and can silently deploy a
          # stale tree when pushes land within an hour of each other.
          script: sudo nixos-rebuild switch --flake github:AnonMiraj/.dotfiles/${{ github.sha }}#almiraj

