name: "CI"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    # Fork PRs never receive repository secrets, so the private cashflow input
    # cannot be fetched there. Skip rather than fail; same-repo PRs and pushes
    # still get the read-only automation key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: determinatesystems/nix-installer-action@v23
        with:
          determinate: false
          diagnostic-endpoint: ""
          logger: pretty
          source-url: https://install.lix.systems/lix/lix-installer-x86_64-linux
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          diagnostic-endpoint: ""
      # The cashflow input is a private repo. Install the read-only automation
      # key (also present on the VPS) where both ssh and libgit2 look for it,
      # so `nix flake check` can fetch it. The key is written from an env var to
      # keep it out of the command text in the job log.
      - name: Configure ssh for the private cashflow input
        env:
          CASHFLOW_DEPLOY_KEY: ${{ secrets.CASHFLOW_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CASHFLOW_DEPLOY_KEY" > ~/.ssh/cashflow_deploy_key
          cp ~/.ssh/cashflow_deploy_key ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/cashflow_deploy_key ~/.ssh/id_ed25519
          printf 'Host github.com\n  IdentityFile ~/.ssh/cashflow_deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: flake check
        run: nix flake check

  # Update the VPS directly: SSH in and rebuild from the pushed flake.
  # The box builds aarch64 natively, so no self-hosted runner is needed.
  # Requires repo secret ALMIRAJ_DEPLOY_KEY: an SSH key authorized for
  # admin@ssh.almiraj.xyz (passwordless sudo).
  almiraj-deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: deploy
        uses: appleboy/ssh-action@v1.2.3
        with:
          host: ssh.almiraj.xyz
          username: admin
          key: ${{ secrets.ALMIRAJ_DEPLOY_KEY }}
          fingerprint: SHA256:7pl1zDtSI7wLEe4DuFXqkU4K2wYAiuQRmvFjp2Npu/s
          # Pin to the pushed SHA, not `main`: github: ref fetches hit the
          # root fetcher cache (tarball-ttl 3600s) and can silently deploy a
          # stale tree when pushes land within an hour of each other.
          script: sudo nixos-rebuild switch --flake github:AnonMiraj/.dotfiles/${{ github.sha }}#almiraj

