add_newline = false
format = """
$cmd_duration$directory $git_branch $nix_shell
$character
"""
palette = "noctalia"

[character]
error_symbol = "[• 󰅙](bold fg:red)"
success_symbol = "[• ](bold fg:rosewater)"

[cmd_duration]
format = "[](bold fg:pink)[ $duration](bold bg:pink fg:text)[](bold fg:pink) •• "
min_time = 0

[directory]
format = "[](bold fg:surface2)[$path ]($style)[](bold fg:surface2)"
home_symbol = "  "
read_only = "  "
style = "bg:surface2 fg:pink"
truncation_length = 6
truncation_symbol = "••/"

[directory.substitutions]
Desktop = "  "
Documents = "  "
Downloads = "  "
Music = " 󰎈 "
Pictures = "  "
Videos = "  "

[git_branch]
format = "• [](bold fg:surface2)[$symbol $branch(:$remote_branch)](fg:peach bg:surface2)[ ](bold fg:surface2)"
symbol = "󰘬"
truncation_length = 4
truncation_symbol = ""

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
cherry_pick = "[🍒 PICKING](bold red)"
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
ahead = " 🏎💨 "
behind = " 😰 "
conflicted = " 🏳 "
deleted = " 🗑 "
diverged = " 😵 "
modified = " 📝 "
renamed = " ✍️ "
staged = '[++\($count\)](fg:flamingo)'
stashed = " 📦 "
untracked = " 🤷 "

[hostname]
disabled = false
format = "[•$hostname](bg:flamingo bold fg:peach)[](bold fg:flamingo)"
ssh_only = false
trim_at = ".companyname.com"

[line_break]
disabled = false

[memory_usage]
disabled = true
style = "bold dimmed flamingo"
symbol = " "
threshold = -1

[nix_shell]
format = 'via [☃️ $state( \($name\))](bold blue) '
impure_msg = "[impure shell](bold red)"
pure_msg = "[pure shell](bold green)"
unknown_msg = "[unknown shell](bold yellow)"

[package]
disabled = true

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
disabled = false
format = "[](bold fg:flamingo)[$user]($style)"
show_always = true
style_root = "bold fg:red"
style_user = "bold bg:flamingo fg:peach"

